<!DOCTYPE html>
<html>
<head><title>Login</title></head>
<body>
    <h2>Iniciar Sesión</h2>
    <form id="loginForm">
        <label>Usuario: <input type="text" name="user" required></label>
        <label>Clave: <input type="password" name="password" minlength="6"></label>
        <!-- Validación: autenticación básica con usuario y contraseña -->
        <button type="submit">Ingresar</button>
    </form>
</body>
</html>
