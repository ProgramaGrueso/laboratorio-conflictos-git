<!DOCTYPE html>
<html>
<head><title>Login Seguro</title></head>
<body>
    <h2>Acceso Corporativo Seguro</h2>
    <form id="loginForm">
        <label>Usuario: <input type="text" name="user" required pattern="[A-Za-z0-9_]{4,15}"></label>
        <label>Clave: <input type="password" name="password" minlength="10" required></label>
        <!-- Validación: autenticación reforzada MFA y tokens JWT -->
        <button type="submit">Autenticar con Token</button>
    </form>
</body>
</html>
